<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="550" viewBox="0 0 800 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="550" fill="#F8FAFC"/>
  <ellipse cx="400" cy="480" rx="320" ry="22" fill="#000000" fill-opacity="0.08"/>
  
  <!-- Car Body -->
  <path d="M150 360 C170 300 230 190 320 180 L520 180 C580 190 620 260 650 330 L670 370 C690 390 690 420 670 440 L150 440 C130 420 130 380 150 360 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <!-- Windows -->
  <path d="M310 195 L515 195 L565 285 L245 285 Z" fill="#0F172A" opacity="0.88"/>
  <!-- Roof Rails -->
  <rect x="280" y="170" width="280" height="6" rx="3" fill="#64748B"/>
  <!-- Wheels -->
  <circle cx="230" cy="445" r="45" fill="#0F172A"/>
  <circle cx="230" cy="445" r="25" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  <circle cx="590" cy="445" r="45" fill="#0F172A"/>
  <circle cx="590" cy="445" r="25" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  <!-- Front Grille -->
  <rect x="190" y="350" width="430" height="65" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M145 360 L195 355 L190 390 L140 385 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  <path d="M655 360 L605 355 L610 390 L660 385 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  
  
  <!-- SZT Official Commercial Sticker -->
  <g transform="translate(355, 355)">
    <rect width="90" height="26" rx="4" fill="#0F172A" stroke="#FACC15" stroke-width="1.5"/>
    <text x="8" y="18" fill="#FACC15" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" letter-spacing="1">SZT</text>
    <text x="42" y="13" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="7.5">SOUTH ZOOM</text>
    <text x="42" y="22" fill="#94A3B8" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="6.5">TOURISM</text>
  </g>

  
  <!-- Yellow Commercial KA Board -->
  <g transform="translate(280, 420)">
    <!-- Plate base with yellow commercial fill and border -->
    <rect width="240" height="40" rx="5" fill="#FACC15" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="2" y="2" width="236" height="36" rx="3" fill="none" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 2"/>
    <!-- IND blue strip on left -->
    <rect x="3" y="3" width="16" height="34" rx="2" fill="#1D4ED8"/>
    <circle cx="11" cy="18" r="3" fill="#FACC15" opacity="0.9"/>
    <text x="11" y="28" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="7">IND</text>
    <!-- KA Registered Number -->
    <text x="128" y="25" text-anchor="middle" fill="#000000" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="13" letter-spacing="1.5">KA 04 SZT 3003</text>
  </g>

</svg>