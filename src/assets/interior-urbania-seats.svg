<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="550" viewBox="0 0 800 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="550" fill="#050811"/>
  
  <!-- Luxury Aircraft-style Ceiling & Ambient Cyan LED Strips -->
  <path d="M60 0 L740 0 L700 70 L100 70 Z" fill="#0F172A"/>
  <line x1="120" y1="35" x2="680" y2="35" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <!-- Individual Reading AC Pods -->
  <rect x="180" y="48" width="80" height="16" rx="4" fill="#1E293B" stroke="#0284C7"/>
  <rect x="540" y="48" width="80" height="16" rx="4" fill="#1E293B" stroke="#0284C7"/>
  
  <!-- Left Luxury Recliner Seat -->
  <g transform="translate(130, 105)">
    <rect x="65" y="0" width="110" height="65" rx="16" fill="#334155" stroke="#38BDF8" stroke-width="2"/>
    <path d="M25 60 C25 60 55 65 120 65 C185 65 215 60 215 60 L230 280 C230 300 210 310 185 310 L55 310 C30 310 10 300 10 280 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="45" y="80" width="150" height="175" rx="14" fill="#0F172A"/>
    <!-- Diamond Quilted Stitch Pattern -->
    <path d="M65 110 L120 160 L175 110 M65 170 L120 220 L175 170" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
    <!-- Armrests -->
    <rect x="0" y="160" width="25" height="100" rx="10" fill="#334155" stroke="#64748B"/>
    <rect x="215" y="160" width="25" height="100" rx="10" fill="#334155" stroke="#64748B"/>
    <rect x="15" y="295" width="210" height="90" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  </g>
  
  <!-- Right Luxury Recliner Seat -->
  <g transform="translate(430, 105)">
    <rect x="65" y="0" width="110" height="65" rx="16" fill="#334155" stroke="#38BDF8" stroke-width="2"/>
    <path d="M25 60 C25 60 55 65 120 65 C185 65 215 60 215 60 L230 280 C230 300 210 310 185 310 L55 310 C30 310 10 300 10 280 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="45" y="80" width="150" height="175" rx="14" fill="#0F172A"/>
    <!-- Diamond Quilted Stitch Pattern -->
    <path d="M65 110 L120 160 L175 110 M65 170 L120 220 L175 170" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
    <!-- Armrests -->
    <rect x="0" y="160" width="25" height="100" rx="10" fill="#334155" stroke="#64748B"/>
    <rect x="215" y="160" width="25" height="100" rx="10" fill="#334155" stroke="#64748B"/>
    <rect x="15" y="295" width="210" height="90" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  </g>
  
  <!-- Center Floor Ambient Walkway -->
  <rect x="360" y="100" width="80" height="450" fill="#020617"/>
  <line x1="400" y1="100" x2="400" y2="550" stroke="#0284C7" stroke-width="3" opacity="0.5"/>
  
  <!-- Floor -->
  <rect x="0" y="470" width="800" height="80" fill="#020617"/>
  
  <!-- Badge Label -->
  <g transform="translate(30, 30)">
    <rect width="290" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="12" y="22" fill="#38BDF8" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13">FORCE URBANIA LUXURY INTERIOR</text>
