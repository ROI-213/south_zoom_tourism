  <g transform="translate(30, 30)">
    <rect width="290" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#EF4444" stroke-width="1.5"/>
    <text x="12" y="22" fill="#FCA5A5" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13">TOURIST BUS 2×2 PUSHBACK SEATING</text>
