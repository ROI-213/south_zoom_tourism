  <rect x="50" y="65" width="310" height="20" rx="4" fill="#334155" stroke="#64748B"/>
  <rect x="440" y="65" width="310" height="20" rx="4" fill="#334155" stroke="#64748B"/>
  
  <!-- Left Side: 2 Pushback Coach Seats with Recliner Handles -->
  <g transform="translate(60, 110)">
    <g transform="translate(0, 0)">
      <rect x="25" y="0" width="85" height="60" rx="14" fill="#991B1B" stroke="#EF4444" stroke-width="2"/>
      <path d="M10 55 L125 55 L130 270 L5 270 Z" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
      <rect x="20" y="75" width="95" height="170" rx="12" fill="#7F1D1D"/>
      <rect x="0" y="260" width="135" height="80" rx="14" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
    </g>
    <g transform="translate(145, 0)">
      <rect x="25" y="0" width="85" height="60" rx="14" fill="#991B1B" stroke="#EF4444" stroke-width="2"/>
      <path d="M10 55 L125 55 L130 270 L5 270 Z" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
      <rect x="20" y="75" width="95" height="170" rx="12" fill="#7F1D1D"/>
      <rect x="0" y="260" width="135" height="80" rx="14" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Center Coach Aisle -->
  <rect x="365" y="90" width="70" height="460" fill="#020617"/>
  <line x1="400" y1="90" x2="400" y2="550" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  
  <!-- Right Side: 2 Pushback Coach Seats -->
  <g transform="translate(460, 110)">
    <g transform="translate(0, 0)">
      <rect x="25" y="0" width="85" height="60" rx="14" fill="#991B1B" stroke="#EF4444" stroke-width="2"/>
      <path d="M10 55 L125 55 L130 270 L5 270 Z" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
      <rect x="20" y="75" width="95" height="170" rx="12" fill="#7F1D1D"/>
      <rect x="0" y="260" width="135" height="80" rx="14" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
    </g>
    <g transform="translate(145, 0)">
      <rect x="25" y="0" width="85" height="60" rx="14" fill="#991B1B" stroke="#EF4444" stroke-width="2"/>
      <path d="M10 55 L125 55 L130 270 L5 270 Z" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
      <rect x="20" y="75" width="95" height="170" rx="12" fill="#7F1D1D"/>
      <rect x="0" y="260" width="135" height="80" rx="14" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Floor -->
  <rect x="0" y="470" width="800" height="80" fill="#020617"/>
  
