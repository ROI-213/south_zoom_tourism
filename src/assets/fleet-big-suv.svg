    <rect width="260" height="42" rx="5" fill="#FACC15" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="2" y="2" width="256" height="38" rx="3" fill="none" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 2"/>
