  <!-- Roof Rails -->
  <rect x="290" y="152" width="280" height="6" rx="3" fill="#475569"/>
  <!-- Wheels -->
  <circle cx="220" cy="445" r="46" fill="#0F172A"/>
  <circle cx="220" cy="445" r="26" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  <circle cx="620" cy="445" r="46" fill="#0F172A"/>
  <circle cx="620" cy="445" r="26" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  <!-- Chrome Grille & Headlights -->
  <rect x="170" y="340" width="480" height="75" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="240" y="350" width="320" height="40" rx="6" fill="#1E293B"/>
  <line x1="240" y1="362" x2="560" y2="362" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="240" y1="375" x2="560" y2="375" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="400" cy="370" rx="14" ry="10" fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
  <path d="M125 350 L180 345 L175 385 L120 380 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  <path d="M685 350 L630 345 L635 385 L690 380 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  
  
  <!-- SZT Official Commercial Sticker -->
  <g transform="translate(355, 305)">
    <rect width="90" height="26" rx="4" fill="#0F172A" stroke="#FACC15" stroke-width="1.5"/>
    <text x="8" y="18" fill="#FACC15" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" letter-spacing="1">SZT</text>
    <text x="42" y="13" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="7.5">SOUTH ZOOM</text>
    <text x="42" y="22" fill="#94A3B8" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="6.5">TOURISM</text>
  </g>

  
  <!-- Yellow Commercial KA Board -->
  <g transform="translate(270, 418)">
