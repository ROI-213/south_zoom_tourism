<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="550" viewBox="0 0 800 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="550" fill="#0F172A"/>
  
  <!-- Car Roof & Ambient Lighting -->
  <path d="M100 0 L700 0 L660 80 L140 80 Z" fill="#1E293B"/>
  <line x1="160" y1="50" x2="640" y2="50" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Center Roof Console AC vents -->
  <rect x="340" y="20" width="120" height="40" rx="8" fill="#334155" stroke="#64748B"/>
  <line x1="360" y1="35" x2="440" y2="35" stroke="#94A3B8" stroke-width="2"/>
  <line x1="360" y1="45" x2="440" y2="45" stroke="#94A3B8" stroke-width="2"/>
  
  <!-- Left Captain Seat -->
  <g transform="translate(140, 120)">
    <!-- Headrest -->
    <rect x="70" y="0" width="100" height="70" rx="20" fill="#78350F" stroke="#D97706" stroke-width="2"/>
    <!-- Backrest -->
    <path d="M30 65 C30 65 60 70 120 70 C180 70 210 65 210 65 L225 290 C225 310 205 320 180 320 L60 320 C35 320 15 310 15 290 Z" fill="#92400E" stroke="#B45309" stroke-width="3"/>
    <!-- Plush Contoured Cushions -->
    <rect x="50" y="90" width="140" height="180" rx="16" fill="#78350F"/>
    <line x1="120" y1="100" x2="120" y2="260" stroke="#D97706" stroke-width="2" opacity="0.6"/>
    <!-- Armrests -->
    <rect x="0" y="190" width="30" height="110" rx="12" fill="#78350F" stroke="#B45309" stroke-width="2"/>
    <rect x="210" y="190" width="30" height="110" rx="12" fill="#78350F" stroke="#B45309" stroke-width="2"/>
    <!-- Seat Base Cushion -->
    <rect x="20" y="305" width="200" height="95" rx="20" fill="#92400E" stroke="#B45309" stroke-width="3"/>
  </g>
  
  <!-- Right Captain Seat -->
  <g transform="translate(420, 120)">
    <!-- Headrest -->
    <rect x="70" y="0" width="100" height="70" rx="20" fill="#78350F" stroke="#D97706" stroke-width="2"/>
    <!-- Backrest -->
    <path d="M30 65 C30 65 60 70 120 70 C180 70 210 65 210 65 L225 290 C225 310 205 320 180 320 L60 320 C35 320 15 310 15 290 Z" fill="#92400E" stroke="#B45309" stroke-width="3"/>
    <!-- Plush Contoured Cushions -->
    <rect x="50" y="90" width="140" height="180" rx="16" fill="#78350F"/>
    <line x1="120" y1="100" x2="120" y2="260" stroke="#D97706" stroke-width="2" opacity="0.6"/>
    <!-- Armrests -->
    <rect x="0" y="190" width="30" height="110" rx="12" fill="#78350F" stroke="#B45309" stroke-width="2"/>
    <rect x="210" y="190" width="30" height="110" rx="12" fill="#78350F" stroke="#B45309" stroke-width="2"/>
    <!-- Seat Base Cushion -->
    <rect x="20" y="305" width="200" height="95" rx="20" fill="#92400E" stroke="#B45309" stroke-width="3"/>
  </g>
  
  <!-- Floor & Middle Aisle with plush carpeting -->
  <rect x="0" y="470" width="800" height="80" fill="#020617"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#334155" stroke-width="2"/>
  
  <!-- Badge Label -->
  <g transform="translate(30, 30)">
    <rect width="260" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#D97706" stroke-width="1.5"/>
    <text x="12" y="22" fill="#FBBF24" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13">INNOVA CRYSTA CAPTAIN SEATS</text>
  </g>
</svg>