  <!-- Modern European Aerodynamic Urbania Body -->
  <path d="M110 400 C120 220 180 130 300 115 L560 115 C660 125 710 200 710 400 C710 435 690 445 660 445 L140 445 C110 445 105 425 110 400 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
