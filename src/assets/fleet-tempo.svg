<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="550" viewBox="0 0 800 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="550" fill="#F8FAFC"/>
  <ellipse cx="400" cy="485" rx="340" ry="24" fill="#000000" fill-opacity="0.09"/>
  
  <!-- High Roof Tempo Body -->
  <path d="M120 400 C130 240 160 130 260 120 L580 120 C670 130 700 200 700 400 C700 435 680 445 650 445 L150 445 C120 445 115 425 120 400 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <!-- High roof AC pod / luggage rack -->
  <rect x="250" y="96" width="340" height="24" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- Front windshield & side windows -->
  <rect x="180" y="150" width="460" height="130" rx="10" fill="#0F172A" opacity="0.9"/>
  <line x1="300" y1="150" x2="300" y2="280" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4"/>
  <line x1="420" y1="150" x2="420" y2="280" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4"/>
  <line x1="530" y1="150" x2="530" y2="280" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4"/>
  
  <!-- Wheels -->
  <circle cx="210" cy="445" r="46" fill="#0F172A"/>
  <circle cx="210" cy="445" r="25" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  <circle cx="600" cy="445" r="46" fill="#0F172A"/>
  <circle cx="600" cy="445" r="25" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  
  <!-- Front Force Grille -->
  <rect x="160" y="325" width="500" height="75" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="230" y="335" width="360" height="36" rx="4" fill="#1E293B"/>
  <text x="410" y="358" text-anchor="middle" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" letter-spacing="3">FORCE TEMPO TRAVELLER</text>
  <path d="M120 335 L165 330 L160 375 L115 370 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  <path d="M700 335 L655 330 L660 375 L705 370 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  
  <!-- SZT Side & Front Branding Sticker -->
  
  <!-- SZT Official Commercial Sticker -->
  <g transform="translate(355, 290)">
    <rect width="96" height="28" rx="4" fill="#0F172A" stroke="#FACC15" stroke-width="1.5"/>
    <text x="8" y="18" fill="#FACC15" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" letter-spacing="1">SZT</text>
    <text x="42" y="13" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="7.5">SOUTH ZOOM</text>
    <text x="42" y="22" fill="#94A3B8" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="6.5">TOURISM</text>
  </g>

  
  <!-- Yellow Commercial KA Board -->
  <g transform="translate(265, 418)">
    <!-- Plate base with yellow commercial fill and border -->
    <rect width="270" height="44" rx="5" fill="#FACC15" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="2" y="2" width="266" height="40" rx="3" fill="none" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 2"/>
    <!-- IND blue strip on left -->
    <rect x="3" y="3" width="16" height="38" rx="2" fill="#1D4ED8"/>
    <circle cx="11" cy="20" r="3" fill="#FACC15" opacity="0.9"/>
    <text x="11" y="30" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="7">IND</text>
    <!-- KA Registered Number -->
    <text x="143" y="27" text-anchor="middle" fill="#000000" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="15" letter-spacing="1.5">KA 04 SZT 5005</text>
  </g>

</svg>