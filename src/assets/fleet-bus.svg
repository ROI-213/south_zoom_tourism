<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="550" viewBox="0 0 800 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="550" fill="#F8FAFC"/>
  <ellipse cx="400" cy="490" rx="350" ry="25" fill="#000000" fill-opacity="0.09"/>
  
  <!-- Large Coach Body -->
  <path d="M100 400 C110 200 130 115 220 105 L670 105 C730 115 745 180 745 390 C745 435 725 450 690 450 L130 450 C100 450 95 425 100 400 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <!-- Top AC Unit -->
  <rect x="260" y="80" width="360" height="25" rx="5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- Wide Panoramic Coach Windows -->
  <rect x="150" y="130" width="560" height="150" rx="10" fill="#0F172A" opacity="0.9"/>
  <line x1="260" y1="130" x2="260" y2="280" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <line x1="370" y1="130" x2="370" y2="280" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <line x1="480" y1="130" x2="480" y2="280" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <line x1="590" y1="130" x2="590" y2="280" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  
  <!-- Triple Wheels for Coach -->
  <circle cx="190" cy="448" r="45" fill="#0F172A"/>
  <circle cx="190" cy="448" r="24" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  <circle cx="560" cy="448" r="45" fill="#0F172A"/>
  <circle cx="560" cy="448" r="24" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  <circle cx="660" cy="448" r="45" fill="#0F172A"/>
  <circle cx="660" cy="448" r="24" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  
  <!-- Front Bumper & Headlights -->
  <rect x="140" y="330" width="580" height="85" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M105 340 L150 335 L145 385 L100 380 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  <path d="M740 340 L695 335 L700 385 L745 380 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  
  <!-- SZT Commercial Branding -->
  
  <!-- SZT Official Commercial Sticker -->
  <g transform="translate(355, 300)">
    <rect width="100" height="30" rx="4" fill="#0F172A" stroke="#FACC15" stroke-width="1.5"/>
    <text x="8" y="18" fill="#FACC15" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" letter-spacing="1">SZT</text>
    <text x="42" y="13" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="7.5">SOUTH ZOOM</text>
    <text x="42" y="22" fill="#94A3B8" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="6.5">TOURISM</text>
  </g>

  
  <!-- Yellow Commercial KA Board -->
  <g transform="translate(265, 420)">
    <!-- Plate base with yellow commercial fill and border -->
    <rect width="280" height="46" rx="5" fill="#FACC15" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="2" y="2" width="276" height="42" rx="3" fill="none" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 2"/>
    <!-- IND blue strip on left -->
    <rect x="3" y="3" width="16" height="40" rx="2" fill="#1D4ED8"/>
    <circle cx="11" cy="21" r="3" fill="#FACC15" opacity="0.9"/>
    <text x="11" y="31" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="7">IND</text>
    <!-- KA Registered Number -->
    <text x="148" y="28" text-anchor="middle" fill="#000000" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="15" letter-spacing="1.5">KA 04 SZT 7007</text>
  </g>

</svg>