<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="550" viewBox="0 0 800 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="550" fill="#0B1120"/>
  
  <!-- High Roof Ceiling with Ambient Warm Lights -->
  <path d="M50 0 L750 0 L710 70 L90 70 Z" fill="#1E293B"/>
  <circle cx="250" cy="35" r="8" fill="#FDE047" opacity="0.9"/>
  <circle cx="400" cy="35" r="8" fill="#FDE047" opacity="0.9"/>
  <circle cx="550" cy="35" r="8" fill="#FDE047" opacity="0.9"/>
  <!-- Overhead Luggage Racks -->
  <rect x="60" y="65" width="280" height="18" rx="4" fill="#334155" stroke="#475569"/>
  <rect x="460" y="65" width="280" height="18" rx="4" fill="#334155" stroke="#475569"/>
  
  <!-- Left Side: Double Pushback Recliner Seats (2-Seater Row) -->
  <g transform="translate(70, 110)">
    <!-- Seat 1 (Window) -->
    <rect x="25" y="0" width="80" height="55" rx="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2"/>
    <path d="M10 50 L120 50 L125 260 L5 260 Z" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2"/>
    <rect x="20" y="70" width="90" height="160" rx="12" fill="#1E3A8A"/>
    <rect x="0" y="250" width="130" height="80" rx="14" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2"/>
    <rect x="120" y="140" width="20" height="90" rx="8" fill="#0F172A"/>

    <!-- Seat 2 (Aisle) -->
    <g transform="translate(135, 0)">
      <rect x="25" y="0" width="80" height="55" rx="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2"/>
      <path d="M10 50 L120 50 L125 260 L5 260 Z" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2"/>
      <rect x="20" y="70" width="90" height="160" rx="12" fill="#1E3A8A"/>
      <rect x="0" y="250" width="130" height="80" rx="14" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2"/>
      <rect x="120" y="140" width="20" height="90" rx="8" fill="#0F172A"/>
    </g>
  </g>
  
  <!-- Wide Walking Center Aisle with illuminated floor pathway -->
  <rect x="360" y="100" width="90" height="450" fill="#020617"/>
  <line x1="405" y1="100" x2="405" y2="550" stroke="#FDE047" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- Right Side: Single Pushback Recliner Seat (1-Seater Row for 2x1 Layout) -->
  <g transform="translate(490, 110)">
    <rect x="35" y="0" width="90" height="55" rx="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2"/>
    <path d="M15 50 L145 50 L150 260 L10 260 Z" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2"/>
    <rect x="30" y="70" width="100" height="160" rx="12" fill="#1E3A8A"/>
    <!-- Armrests on both sides for VIP single seat -->
    <rect x="0" y="140" width="20" height="90" rx="8" fill="#0F172A"/>
    <rect x="140" y="140" width="20" height="90" rx="8" fill="#0F172A"/>
    <rect x="5" y="250" width="150" height="80" rx="14" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2"/>
  </g>
  
  <!-- Bottom Floor Area -->
  <rect x="0" y="470" width="800" height="80" fill="#020617"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#334155" stroke-width="2"/>
  
  <!-- Badge Label -->
  <g transform="translate(30, 30)">
    <rect width="290" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="12" y="22" fill="#60A5FA" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13">TEMPO TRAVELLER 2×1 RECLINER SEATS</text>
  </g>
</svg>