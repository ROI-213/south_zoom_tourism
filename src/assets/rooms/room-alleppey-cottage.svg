<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="keralaSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="40%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="lakeWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="teakCeiling" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Kerala Wood Ceiling & Walls -->
  <rect width="800" height="600" fill="#78350f"/>

  <!-- Sloping Wood Ceiling Beams -->
  <polygon points="0,0 800,0 800,120 0,120" fill="url(#teakCeiling)"/>
  <line x1="100" y1="0" x2="100" y2="120" stroke="#290e02" stroke-width="4"/>
  <line x1="250" y1="0" x2="250" y2="120" stroke="#290e02" stroke-width="4"/>
  <line x1="400" y1="0" x2="400" y2="120" stroke="#290e02" stroke-width="4"/>
  <line x1="550" y1="0" x2="550" y2="120" stroke="#290e02" stroke-width="4"/>
  <line x1="700" y1="0" x2="700" y2="120" stroke="#290e02" stroke-width="4"/>

  <!-- Polished Red Oxide / Terracotta Floor -->
  <polygon points="0,420 800,420 800,600 0,600" fill="#991b1b"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#7f1d1d" stroke-width="2"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#7f1d1d" stroke-width="2"/>

  <!-- Arch Bay Window Overlooking Alleppey Lake & Palms -->
  <path d="M60 120 L440 120 L440 390 L60 390 Z" fill="url(#keralaSky)"/>
  <!-- Alleppey Lake Water -->
  <rect x="60" y="270" width="380" height="120" fill="url(#lakeWater)"/>
  <!-- Coconut Palms Outside -->
  <path d="M120 270 Q110 200 80 160" stroke="#15803d" stroke-width="6" fill="none"/>
  <path d="M80 160 Q60 140 40 160 M80 160 Q100 130 110 160 M80 160 Q70 170 90 190" stroke="#16a34a" stroke-width="4" fill="none"/>
  
  <path d="M400 270 Q410 190 430 150" stroke="#15803d" stroke-width="6" fill="none"/>
  <!-- Houseboat Silhouette on Lake -->
  <path d="M220 285 Q260 270 300 285 L290 295 L230 295 Z" fill="#451a03"/>

  <!-- Window Carved Wooden Frame -->
  <rect x="60" y="120" width="380" height="270" rx="4" fill="none" stroke="#451a03" stroke-width="12"/>
  <line x1="250" y1="120" x2="250" y2="390" stroke="#451a03" stroke-width="6"/>

  <!-- Traditional Four-Poster Teak Bed Right -->
  <rect x="470" y="160" width="16" height="300" fill="#290e02"/>
  <rect x="750" y="160" width="16" height="300" fill="#290e02"/>
  <!-- Top Frame Beam -->
  <rect x="470" y="160" width="296" height="14" fill="#290e02"/>

  <!-- Mosquito Net Canopy Drape -->
  <path d="M470 174 Q610 220 766 174" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.8"/>
  <polygon points="470,174 490,360 470,360" fill="#ffffff" opacity="0.3"/>
  <polygon points="766,174 746,360 766,360" fill="#ffffff" opacity="0.3"/>

  <!-- Bed Mattress -->
  <rect x="480" y="320" width="275" height="110" rx="8" fill="#fffefb" stroke="#e7e5e4" stroke-width="2"/>
  
  <!-- Pillows with Kerala Kasavu Gold Border -->
  <rect x="495" y="295" width="110" height="45" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="630" y="295" width="110" height="45" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>

  <!-- Handwoven Kerala Kasavu Throw (Off-white with Gold Border) -->
  <rect x="480" y="375" width="275" height="45" fill="#fef3c7"/>
  <line x1="480" y1="385" x2="755" y2="385" stroke="#d97706" stroke-width="4"/>

  <!-- Cane Easy Chair Left -->
  <ellipse cx="140" cy="490" rx="45" ry="25" fill="#a16207"/>
  <path d="M100 450 Q140 420 180 450 L180 490 L100 490 Z" fill="#ca8a04"/>

  <!-- Brass Oil Lamp (Nilavilakku) Glow -->
  <ellipse cx="440" cy="460" rx="14" ry="6" fill="#f59e0b"/>
  <path d="M440 460 L440 410" stroke="#d97706" stroke-width="4"/>
  <ellipse cx="440" cy="405" rx="12" ry="5" fill="#fbbf24"/>
  <circle cx="440" cy="400" r="6" fill="#ef4444"/>
  <circle cx="440" cy="400" r="30" fill="#fef08a" opacity="0.35"/>

  <!-- Room Title Banner -->
  <rect x="0" y="540" width="800" height="60" fill="#290e02" opacity="0.9"/>
  <text x="30" y="578" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="22" fill="#ffffff">Lake Facing Cottage · Alleppey Backwaters</text>
  <text x="590" y="578" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="18" fill="#f59e0b">Backwater Retreat</text>
</svg>
