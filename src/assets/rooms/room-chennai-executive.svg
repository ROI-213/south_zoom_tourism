<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="citySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="carpetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4252"/>
      <stop offset="100%" stop-color="#2e3440"/>
    </linearGradient>
    <linearGradient id="cityWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bedNavy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Walls -->
  <rect width="800" height="600" fill="url(#cityWall)"/>
  
  <!-- Carpet Floor -->
  <polygon points="0,400 800,400 800,600 0,600" fill="url(#carpetGrad)"/>
  
  <!-- Accent Wood Panel Wall behind bed -->
  <rect x="0" y="0" width="460" height="400" fill="#332219"/>
  <!-- Vertical Wood Slat Lines -->
  <line x1="40" y1="0" x2="40" y2="400" stroke="#1f140e" stroke-width="2"/>
  <line x1="80" y1="0" x2="80" y2="400" stroke="#1f140e" stroke-width="2"/>
  <line x1="120" y1="0" x2="120" y2="400" stroke="#1f140e" stroke-width="2"/>
  <line x1="160" y1="0" x2="160" y2="400" stroke="#1f140e" stroke-width="2"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#1f140e" stroke-width="2"/>
  <line x1="240" y1="0" x2="240" y2="400" stroke="#1f140e" stroke-width="2"/>
  <line x1="280" y1="0" x2="280" y2="400" stroke="#1f140e" stroke-width="2"/>
  <line x1="320" y1="0" x2="320" y2="400" stroke="#1f140e" stroke-width="2"/>
  <line x1="360" y1="0" x2="360" y2="400" stroke="#1f140e" stroke-width="2"/>
  <line x1="400" y1="0" x2="400" y2="400" stroke="#1f140e" stroke-width="2"/>

  <!-- City Skyline Window Right -->
  <rect x="490" y="30" width="280" height="370" rx="4" fill="url(#citySky)"/>
  <!-- City Buildings Silhouette -->
  <rect x="510" y="200" width="40" height="200" fill="#0f172a"/>
  <rect x="560" y="150" width="55" height="250" fill="#0f172a"/>
  <rect x="625" y="230" width="45" height="170" fill="#0f172a"/>
  <rect x="680" y="180" width="60" height="220" fill="#0f172a"/>
  <!-- Lit Windows in Buildings -->
  <circle cx="580" cy="180" r="3" fill="#fbbf24"/>
  <circle cx="595" cy="210" r="3" fill="#fbbf24"/>
  <circle cx="700" cy="220" r="3" fill="#fbbf24"/>
  <circle cx="715" cy="250" r="3" fill="#fbbf24"/>
  <!-- Window Frame -->
  <rect x="490" y="30" width="280" height="370" rx="4" fill="none" stroke="#0f172a" stroke-width="10"/>

  <!-- Modern Bed -->
  <!-- Low Profile Headboard -->
  <rect x="30" y="220" width="380" height="130" rx="4" fill="#1e1b18"/>
  <rect x="40" y="230" width="360" height="110" rx="2" fill="#2d2926"/>

  <!-- Bed Base -->
  <rect x="30" y="340" width="390" height="110" fill="#1e1b18"/>

  <!-- Crisp White Mattress -->
  <rect x="25" y="300" width="400" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Pillows -->
  <rect x="45" y="275" width="160" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="235" y="275" width="160" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Navy Blue Executive Throw Bed Runner -->
  <rect x="25" y="350" width="400" height="45" fill="url(#bedNavy)"/>

  <!-- Side Pendant Lights with Warm Glow -->
  <line x1="100" y1="0" x2="100" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="100" cy="190" rx="15" ry="10" fill="#fef08a"/>
  <circle cx="100" cy="190" r="45" fill="#fef08a" opacity="0.25"/>

  <line x1="340" y1="0" x2="340" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="340" cy="190" rx="15" ry="10" fill="#fef08a"/>
  <circle cx="340" cy="190" r="45" fill="#fef08a" opacity="0.25"/>

  <!-- Work Desk Left foreground -->
  <rect x="440" y="440" width="330" height="120" rx="6" fill="#1e293b"/>
  <!-- Laptop on Desk -->
  <rect x="520" y="425" width="70" height="40" rx="4" fill="#94a3b8"/>
  <rect x="525" y="430" width="60" height="30" fill="#38bdf8"/>
  <!-- Desk Lamp -->
  <path d="M680 440 L700 400 L730 400" stroke="#f59e0b" stroke-width="4" fill="none"/>
  <circle cx="730" cy="400" r="12" fill="#fbbf24"/>

  <!-- Room Title Banner -->
  <rect x="0" y="540" width="800" height="60" fill="#0f172a" opacity="0.9"/>
  <text x="30" y="578" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="22" fill="#ffffff">Executive Room · Chennai Business Hotel</text>
  <text x="610" y="578" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="18" fill="#38bdf8">Marina Grand</text>
</svg>
