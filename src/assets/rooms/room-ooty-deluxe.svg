<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ootySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fa1b8"/>
      <stop offset="60%" stop-color="#b0caaa"/>
      <stop offset="100%" stop-color="#e8ebd9"/>
    </linearGradient>
    <linearGradient id="ootyHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d5e3e"/>
      <stop offset="100%" stop-color="#193823"/>
    </linearGradient>
    <linearGradient id="woodFloor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c3821"/>
      <stop offset="50%" stop-color="#704428"/>
      <stop offset="100%" stop-color="#4a2c19"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ece4"/>
      <stop offset="100%" stop-color="#e3d7c7"/>
    </linearGradient>
    <linearGradient id="bedCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f5f0"/>
      <stop offset="100%" stop-color="#ded8cb"/>
    </linearGradient>
    <linearGradient id="runnerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#802b2b"/>
      <stop offset="100%" stop-color="#b54343"/>
    </linearGradient>
  </defs>

  <!-- Room Walls & Ceiling -->
  <rect width="800" height="600" fill="url(#wallGrad)"/>
  
  <!-- Floor -->
  <polygon points="0,420 800,420 800,600 0,600" fill="url(#woodFloor)"/>
  <!-- Floor Planks -->
  <line x1="0" y1="460" x2="800" y2="460" stroke="#3b2212" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="510" x2="800" y2="510" stroke="#3b2212" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#3b2212" stroke-width="1.5" opacity="0.4"/>

  <!-- Large Panoramic Window to Valley View -->
  <rect x="50" y="40" width="380" height="360" rx="6" fill="url(#ootySky)"/>
  <!-- Misty Hills outside window -->
  <path d="M50 260 Q140 180 230 230 T430 210 L430 400 L50 400 Z" fill="url(#ootyHills)" opacity="0.75"/>
  <path d="M50 290 Q180 230 300 270 T430 250 L430 400 L50 400 Z" fill="#1b4229" opacity="0.9"/>
  <!-- Tea garden lines on hill -->
  <path d="M80 320 Q180 300 280 330" stroke="#2e633d" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M90 340 Q190 320 310 350" stroke="#2e633d" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Window Frame -->
  <rect x="50" y="40" width="380" height="360" rx="6" fill="none" stroke="#2a1f18" stroke-width="12"/>
  <line x1="240" y1="40" x2="240" y2="400" stroke="#2a1f18" stroke-width="6"/>

  <!-- Warm Sun Beam from window -->
  <polygon points="50,40 430,40 700,600 0,600" fill="#fff5cc" opacity="0.12"/>

  <!-- Headboard -->
  <rect x="470" y="160" width="280" height="180" rx="8" fill="#3b2416" stroke="#24140b" stroke-width="4"/>
  <rect x="485" y="175" width="250" height="150" rx="4" fill="#4d301e"/>
  <!-- Tufted details -->
  <circle cx="530" cy="220" r="4" fill="#24140b"/>
  <circle cx="610" cy="220" r="4" fill="#24140b"/>
  <circle cx="690" cy="220" r="4" fill="#24140b"/>
  <circle cx="570" cy="270" r="4" fill="#24140b"/>
  <circle cx="650" cy="270" r="4" fill="#24140b"/>

  <!-- Nightstand & Lamp left of bed -->
  <rect x="440" y="320" width="55" height="110" fill="#382215" rx="4"/>
  <path d="M455 320 L480 320 L485 270 L450 270 Z" fill="#fcf8ed" opacity="0.9"/>
  <line x1="467" y1="270" x2="467" y2="320" stroke="#b89540" stroke-width="3"/>
  <!-- Lamp glow -->
  <circle cx="467" cy="295" r="40" fill="#ffeaa7" opacity="0.25"/>

  <!-- Bed Base -->
  <rect x="490" y="330" width="280" height="140" rx="8" fill="#52331f"/>

  <!-- Mattress & Sheet -->
  <rect x="485" y="310" width="285" height="110" rx="10" fill="url(#bedCover)"/>
  
  <!-- Pillows -->
  <rect x="500" y="290" width="110" height="50" rx="12" fill="#ffffff" stroke="#e0dad0" stroke-width="2"/>
  <rect x="630" y="290" width="110" height="50" rx="12" fill="#ffffff" stroke="#e0dad0" stroke-width="2"/>
  <rect x="515" y="300" width="80" height="35" rx="8" fill="#e3dacb"/>
  <rect x="645" y="300" width="80" height="35" rx="8" fill="#e3dacb"/>

  <!-- Folded Duvet / Blanket -->
  <path d="M485 350 L770 350 L770 420 L485 420 Z" fill="#ededeb"/>
  <!-- Maroon Bed Runner -->
  <rect x="485" y="380" width="285" height="40" fill="url(#runnerGrad)"/>
  <!-- Gold Fringe on Runner -->
  <line x1="485" y1="420" x2="770" y2="420" stroke="#d4af37" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Armchair near window -->
  <ellipse cx="140" cy="480" rx="60" ry="35" fill="#6e5040"/>
  <path d="M90 430 C90 400, 190 400, 190 430 L190 480 L90 480 Z" fill="#8c6854"/>
  <rect x="105" y="445" width="70" height="35" rx="8" fill="#a37c67"/>
  
  <!-- Small Coffee Table -->
  <ellipse cx="240" cy="510" rx="40" ry="20" fill="#3b2416"/>
  <line x1="240" y1="510" x2="240" y2="550" stroke="#24140b" stroke-width="5"/>
  <!-- Coffee Cup on Table -->
  <ellipse cx="235" cy="505" rx="8" ry="4" fill="#ffffff"/>

  <!-- Room Title Banner -->
  <rect x="0" y="540" width="800" height="60" fill="#1c130d" opacity="0.85"/>
  <text x="30" y="578" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="22" fill="#ffffff">Deluxe Valley Room · Ooty Resort</text>
  <text x="620" y="578" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="18" fill="#e2b04a">Hillview Resort</text>
</svg>
